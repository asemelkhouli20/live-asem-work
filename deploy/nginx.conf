server {
    listen 80;
    listen [::]:80;
    server_name live.asem.work;
    root /var/www/live.asem.work/public;
    index index.html;
    charset utf-8;
    server_tokens off;
    sendfile on;
    etag on;
    client_max_body_size 12k;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_static on;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = /api/meetings {
        proxy_pass http://127.0.0.1:3080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
    location /api/ { return 404; }
    if ($request_uri = /index.html) { return 301 /; }
    location = /en { return 301 /en/; }
    if ($request_uri = /en/index.html) { return 301 /en/; }
    location ~ /\. { deny all; }
    location ~* \.(sqlite|db|mjs|tsx|map|env)$ { deny all; }
    location ~* ^/assets/(app|site)-[a-f0-9]+\.(js|css)$ {
        expires 1y;
        try_files $uri =404;
    }
    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
